models:
  # ── OpenAI cloud models ────────────────────────────────────────────────────
  - id: gpt-4o
    name: GPT-4o (Cloud)
    runner: cloud_openai
    model: gpt-4o
    role: coding
    priority: quality
    context_length: 128000
    tags: [cloud, openai, coding]

  - id: gpt-4o-mini
    name: GPT-4o Mini (Cloud)
    runner: cloud_openai
    model: gpt-4o-mini
    role: chat
    priority: fast
    context_length: 128000
    tags: [cloud, openai, chat, fast]

  # ── Anthropic cloud models ─────────────────────────────────────────────────
  - id: claude-sonnet-cloud
    name: Claude Sonnet 4.6 (Cloud)
    runner: cloud_anthropic
    model: claude-sonnet-4-6
    role: coding
    priority: quality
    context_length: 200000
    tags: [cloud, anthropic, coding]

  - id: claude-haiku-cloud
    name: Claude Haiku 4.5 (Cloud)
    runner: cloud_anthropic
    model: claude-haiku-4-5-20251001
    role: chat
    priority: fast
    context_length: 200000
    tags: [cloud, anthropic, chat, fast]

default_model: gpt-4o-mini

fallback_chains:
  - name: coding
    models:
      - claude-sonnet-cloud
      - gpt-4o
      - gpt-4o-mini
  - name: chat
    models:
      - gpt-4o-mini
      - claude-haiku-cloud
  - name: agent
    models:
      - claude-sonnet-cloud
      - gpt-4o
  - name: long_context
    models:
      - claude-sonnet-cloud
      - gpt-4o

aliases:
  - alias: claude-sonnet
    model_id: claude-sonnet-cloud
  - alias: claude-haiku
    model_id: claude-haiku-cloud
  - alias: gpt-4
    model_id: gpt-4o
  - alias: gpt-4o
    model_id: gpt-4o
  - alias: gpt-3.5-turbo
    model_id: gpt-4o-mini
  - alias: active
    model_id: gpt-4o-mini
